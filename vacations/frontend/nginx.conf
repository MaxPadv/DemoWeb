server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # remote публикуется под /mf/vacations/ (publicPath); отдаём dist по этому пути.
  add_header Cache-Control "no-cache, must-revalidate";
  location /mf/vacations/ { alias /usr/share/nginx/html/; }
  location = /mf/vacations { return 301 /mf/vacations/; }
}
