server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # remote публикуется под /mf/structure/ (publicPath); отдаём dist по этому пути.
  add_header Cache-Control "no-cache, must-revalidate";
  location /mf/structure/ { alias /usr/share/nginx/html/; }
  location = /mf/structure { return 301 /mf/structure/; }
}
