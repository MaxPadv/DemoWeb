# API Gateway: единая точка входа. Резолвит имена сервисов через Docker DNS.
# ВАЖНО: в proxy_pass используем переменную `$u` (set ... ) — иначе nginx резолвит
# имя при старте и кэширует IP; при рестарте бэкенда (смена IP) шлюз 502.
# Ленивый резолв с resolver 127.0.0.11 (Docker DNS).
#
# SSO-заглушка (fallback X-User/X-Roles) сохранена для автотестов/автоматизации.
# Для браузера роль приходит из HttpOnly cookie hr_session (auth-сервис).

map $http_x_user $xj_user {
  "" "%D0%98%D0%B2%D0%B0%D0%BD%20%D0%9F%D0%B5%D1%82%D1%80%D0%BE%D0%B2";
  default $http_x_user;
}
map $http_x_user $xj_roles {
  "" "hr";
  default $http_x_roles;
}

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  location ^~ /mf/structure/ { set $u http://frontend-structure:80; proxy_pass $u; }
  location ^~ /mf/vacations/ { set $u http://frontend-vacations:80; proxy_pass $u; }
  location ^~ /mf/auth/ { set $u http://frontend-auth:80; proxy_pass $u; }

  # Auth-бэкенд: login/logout/me по cookie
  location ^~ /api/auth/ {
      proxy_set_header Cookie $http_cookie;
      set $u http://backend-auth:8000;
      proxy_pass $u;
  }

  # /api/me — отдаёт auth-бэкенд (роль из БД по cookie hr_session)
  location ^~ /api/me {
      proxy_set_header Cookie $http_cookie;
      set $u http://backend-auth:8000;
      proxy_pass $u;
  }
  location ^~ /api/structure {
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-User $xj_user;
      proxy_set_header X-Roles $xj_roles;
      set $u http://backend-structure:8000;
      proxy_pass $u;
  }
  location ^~ /api/vacations {
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-User $xj_user;
      proxy_set_header X-Roles $xj_roles;
      set $u http://backend-vacations:8000;
      proxy_pass $u;
  }
  location ^~ /api/services {
      proxy_set_header X-User $xj_user;
      proxy_set_header X-Roles $xj_roles;
      set $u http://backend-vacations:8000;
      proxy_pass $u;
  }
  location ^~ /api/health { set $u http://backend-vacations:8000; proxy_pass $u; }

  location / { set $u http://frontend-shell:80; proxy_pass $u; }
}
